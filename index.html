<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>داشبورد MenuProAI</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="assets/bytelab-auth.js"></script>
<style>
  :root{--ink:#070b12;--panel:#0f1620;--panel-2:#141d2b;--line:#1e2a38;--cyan:#4df0c9;--violet:#9c7bff;--paper:#eaf0f4;--muted:#7c8b9c;--danger:#ff8a8a;--radius:18px;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--ink);color:var(--paper);font-family:'Vazirmatn',sans-serif;line-height:1.7;min-height:100vh;padding:40px 16px 80px;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .wrap{max-width:640px;margin:0 auto;}
  h1{font-size:24px;font-weight:800;margin-bottom:6px;}
  .sub{color:var(--muted);font-size:13.5px;margin-bottom:24px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:16px;}
  .card h2{font-size:15px;color:var(--cyan);margin-bottom:14px;}
  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600;}
  input,textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;color:var(--paper);font-family:inherit;font-size:15px;margin-bottom:14px;}
  input:focus,textarea:focus{outline:2px solid var(--cyan);border-color:var(--cyan);}
  input[dir=ltr]{direction:ltr;text-align:left;font-family:'JetBrains Mono',monospace;}
  textarea{min-height:70px;resize:vertical;}
  button{border:none;border-radius:999px;padding:11px 20px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;}
  .btn-primary{background:var(--cyan);color:#06120f;}
  .btn-primary:disabled{opacity:.55;cursor:not-allowed;}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--paper);}
  .btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger);}
  .btn-sm{padding:7px 12px;font-size:12px;}
  .row{display:flex;gap:8px;}
  .tabs{display:flex;gap:6px;margin-bottom:18px;}
  .tab{flex:1;text-align:center;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;font-size:13px;font-weight:700;}
  .tab.active{background:var(--cyan);color:#06120f;border-color:transparent;}
  .msg{font-size:12.5px;padding:10px 12px;border-radius:8px;margin-bottom:12px;display:none;}
  .msg.show{display:block;}
  .msg.err{background:rgba(255,138,138,.1);color:var(--danger);}
  .msg.ok{background:rgba(77,240,201,.1);color:var(--cyan);}
  .hidden{display:none !important;}
  .item-row{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .item-row .meta{flex:1;min-width:0;}
  .item-row .name{font-weight:700;font-size:13.5px;}
  .item-row .sub{font-size:11.5px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
  .item-actions{display:flex;gap:6px;}
  .chip{display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--muted);margin:0 4px 8px 0;}
  .chip.active{color:var(--cyan);border-color:var(--cyan);}
  .public-link{font-family:'JetBrains Mono',monospace;font-size:12.5px;direction:ltr;text-align:left;background:var(--panel-2);border-radius:10px;padding:12px;word-break:break-all;color:var(--cyan);}
  select{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;color:var(--paper);font-family:inherit;font-size:14px;margin-bottom:14px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>داشبورد MenuProAI</h1>
  <p class="sub">حساب کاربری، ساخت کافه و مدیریت آیتم‌های منو — همه از همین‌جا.</p>

  <!-- ============ بخش ورود/ثبت‌نام ============ -->
  <div class="card" id="authCard">
    <div class="tabs">
      <div class="tab active" data-tab="login">ورود</div>
      <div class="tab" data-tab="register">ثبت‌نام</div>
    </div>
    <div class="msg" id="authMsg"></div>

    <div id="loginPane">
      <label>شماره موبایل</label>
      <input type="text" id="loginPhone" dir="ltr" placeholder="09xxxxxxxxx">
      <label>رمز عبور</label>
      <input type="password" id="loginPass">
      <button class="btn-primary" id="loginBtn" style="width:100%;">ورود</button>
    </div>

    <div id="registerPane" class="hidden">
      <label>نام</label>
      <input type="text" id="regName" placeholder="اسمت">
      <label>شماره موبایل</label>
      <input type="text" id="regPhone" dir="ltr" placeholder="09xxxxxxxxx">
      <label>رمز عبور</label>
      <input type="password" id="regPass">
      <button class="btn-primary" id="registerBtn" style="width:100%;">ثبت‌نام</button>
    </div>
  </div>

  <!-- ============ بخش ساخت کافه (اولین بار) ============ -->
  <div class="card hidden" id="createCard">
    <h2>کسب‌وکارت رو بساز</h2>
    <div class="msg" id="createMsg"></div>
    <label>نام کافه/کسب‌وکار</label>
    <input type="text" id="cCafeName" placeholder="مثلاً کافه بلوط">
    <label>آدرس اختصاصی (فقط انگلیسی، بدون فاصله)</label>
    <input type="text" id="cSlug" dir="ltr" placeholder="kafe-boloot">
    <label>توضیح کوتاه (اختیاری)</label>
    <input type="text" id="cTagline" placeholder="مثلاً کافه‌ای با فضای گرم و صمیمی">
    <button class="btn-primary" id="createBtn" style="width:100%;">ساخت منو</button>
  </div>

  <!-- ============ داشبورد اصلی (بعد از ساخت منو) ============ -->
  <div class="hidden" id="dashboardWrap">
    <div class="card">
      <h2>اطلاعات کافه</h2>
      <div class="msg" id="infoMsg"></div>
      <label>نام کافه</label>
      <input type="text" id="dCafeName">
      <label>توضیح کوتاه</label>
      <input type="text" id="dTagline">
      <button class="btn-ghost btn-sm" id="saveInfoBtn">ذخیره تغییرات</button>
      <div style="margin-top:16px;">
        <label>لینک عمومی منوی شما</label>
        <div class="public-link" id="publicLink"></div>
      </div>
    </div>

    <div class="card">
      <h2>دسته‌بندی‌ها</h2>
      <div class="msg" id="catMsg"></div>
      <div id="catChips"></div>
      <div class="row">
        <input type="text" id="newCatTitle" placeholder="اسم دسته جدید (مثلاً قهوه گرم)" style="margin-bottom:0;">
        <button class="btn-ghost btn-sm" id="addCatBtn">افزودن</button>
      </div>
    </div>

    <div class="card">
      <h2>افزودن آیتم جدید</h2>
      <div class="msg" id="itemMsg"></div>
      <label>نام آیتم</label>
      <input type="text" id="itName" placeholder="مثلاً اسپرسو">
      <label>دسته</label>
      <select id="itCategory"></select>
      <label>قیمت (تومان)</label>
      <input type="text" id="itPrice" dir="ltr" inputmode="numeric" placeholder="55000">
      <label>توضیح کوتاه</label>
      <textarea id="itDesc" placeholder="شات غلیظ و پرقدرت..."></textarea>
      <label>برچسب‌ها (با کاما جدا کن)</label>
      <input type="text" id="itTags" placeholder="تلخ, پرانرژی, کافئین‌دار">
      <button class="btn-primary" id="addItemBtn" style="width:100%;">افزودن آیتم</button>
    </div>

    <div class="card">
      <h2>آیتم‌های منو</h2>
      <div id="itemsList"></div>
    </div>

    <button class="btn-ghost" id="logoutBtn" style="width:100%;">خروج از حساب</button>
  </div>
</div>

<script>
/* ⚠️ بعد از دیپلوی menuproai-worker.js (مرحله ۱)، آدرس زیر رو با آدرس
   واقعی Worker جایگزین کن. */
const MENUPROAI_API = "https://menuproai-api.YOUR-SUBDOMAIN.workers.dev";
const PUBLIC_BASE = "https://menuproai.bytelabpro.xyz/USERS/";

let currentMenu = null;

function showMsg(id, text, kind){
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg show ' + (kind || '');
}
function hideMsg(id){ document.getElementById(id).classList.remove('show'); }

// چون این API روی Worker جدایی از bytelab-users هست، از apiFetch خود
// BytelabAuth استفاده نمی‌کنیم (چون اون به API_URL ثابت bytelab-users می‌زنه)
// ولی همون توکن ذخیره‌شده رو دستی به این Worker جدا می‌فرستیم.
async function apiCall(path, body){
  const token = BytelabAuth.getToken();
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(MENUPROAI_API + path, {
    method: body ? 'POST' : 'GET',
    headers,
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || 'خطا'), { status: res.status, data });
  return data;
}

/* ============ تب‌های ورود/ثبت‌نام ============ */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('loginPane').classList.toggle('hidden', tab.dataset.tab !== 'login');
    document.getElementById('registerPane').classList.toggle('hidden', tab.dataset.tab !== 'register');
    hideMsg('authMsg');
  });
});

document.getElementById('loginBtn').addEventListener('click', async () => {
  const phone = document.getElementById('loginPhone').value.trim();
  const pass = document.getElementById('loginPass').value;
  if (!phone || !pass){ showMsg('authMsg', 'شماره و رمز عبور رو پر کن.', 'err'); return; }
  try{
    await BytelabAuth.login(phone, pass);
    await afterAuth();
  }catch(e){ showMsg('authMsg', e.message, 'err'); }
});

document.getElementById('registerBtn').addEventListener('click', async () => {
  const name = document.getElementById('regName').value.trim();
  const phone = document.getElementById('regPhone').value.trim();
  const pass = document.getElementById('regPass').value;
  if (!name || !phone || !pass){ showMsg('authMsg', 'همه فیلدها رو پر کن.', 'err'); return; }
  try{
    await BytelabAuth.register(phone, pass, name);
    await afterAuth();
  }catch(e){ showMsg('authMsg', e.message, 'err'); }
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await BytelabAuth.logout();
  location.reload();
});

/* ============ بعد از لاگین/ثبت‌نام موفق ============ */
async function afterAuth(){
  document.getElementById('authCard').classList.add('hidden');
  try{
    const data = await apiCall('/api/menu/mine');
    currentMenu = data.menu;
    renderDashboard();
  }catch(e){
    if (e.status === 404){
      document.getElementById('createCard').classList.remove('hidden');
    } else {
      showMsg('createMsg', 'خطا در دریافت اطلاعات: ' + e.message, 'err');
      document.getElementById('createCard').classList.remove('hidden');
    }
  }
}

/* ============ ساخت کافه ============ */
document.getElementById('createBtn').addEventListener('click', async () => {
  const cafeName = document.getElementById('cCafeName').value.trim();
  const slug = document.getElementById('cSlug').value.trim();
  const tagline = document.getElementById('cTagline').value.trim();
  if (!cafeName || !slug){ showMsg('createMsg', 'نام کافه و آدرس اختصاصی الزامی‌ان.', 'err'); return; }
  try{
    const data = await apiCall('/api/menu/create', { cafeName, slug, tagline });
    currentMenu = data.menu;
    document.getElementById('createCard').classList.add('hidden');
    renderDashboard();
  }catch(e){ showMsg('createMsg', e.message, 'err'); }
});

/* ============ رندر داشبورد ============ */
function renderDashboard(){
  document.getElementById('dashboardWrap').classList.remove('hidden');
  document.getElementById('dCafeName').value = currentMenu.cafeName || '';
  document.getElementById('dTagline').value = currentMenu.tagline || '';
  document.getElementById('publicLink').textContent = PUBLIC_BASE + currentMenu.slug + '/menu.html';
  renderCategories();
  renderItems();
}

function renderCategories(){
  const wrap = document.getElementById('catChips');
  wrap.innerHTML = '';
  const catSelect = document.getElementById('itCategory');
  catSelect.innerHTML = '<option value="">— انتخاب دسته —</option>';
  (currentMenu.categories || []).forEach(c => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.innerHTML = c.title + ' <b style="cursor:pointer;color:var(--danger);" data-delcat="' + c.id + '">✕</b>';
    wrap.appendChild(chip);

    const opt = document.createElement('option');
    opt.value = c.id; opt.textContent = c.title;
    catSelect.appendChild(opt);
  });
  wrap.querySelectorAll('[data-delcat]').forEach(b => {
    b.addEventListener('click', async () => {
      try{
        const data = await apiCall('/api/menu/categories/delete', { id: b.dataset.delcat });
        currentMenu = data.menu;
        renderCategories(); renderItems();
      }catch(e){ showMsg('catMsg', e.message, 'err'); }
    });
  });
}

document.getElementById('addCatBtn').addEventListener('click', async () => {
  const title = document.getElementById('newCatTitle').value.trim();
  if (!title){ showMsg('catMsg', 'اسم دسته رو بنویس.', 'err'); return; }
  try{
    const data = await apiCall('/api/menu/categories', { title });
    currentMenu = data.menu;
    document.getElementById('newCatTitle').value = '';
    renderCategories();
  }catch(e){ showMsg('catMsg', e.message, 'err'); }
});

document.getElementById('saveInfoBtn').addEventListener('click', async () => {
  const cafeName = document.getElementById('dCafeName').value.trim();
  const tagline = document.getElementById('dTagline').value.trim();
  try{
    const data = await apiCall('/api/menu/update-info', { cafeName, tagline });
    currentMenu = data.menu;
    showMsg('infoMsg', '✓ ذخیره شد.', 'ok');
  }catch(e){ showMsg('infoMsg', e.message, 'err'); }
});

function renderItems(){
  const wrap = document.getElementById('itemsList');
  wrap.innerHTML = '';
  if (!currentMenu.items.length){
    wrap.innerHTML = '<p style="color:var(--muted);font-size:13px;">هنوز آیتمی اضافه نکردی.</p>';
    return;
  }
  currentMenu.items.forEach(it => {
    const catTitle = (currentMenu.categories.find(c => c.id === it.category) || {}).title || 'بدون دسته';
    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = `
      <div class="meta">
        <div class="name">${escapeHtml(it.name)}</div>
        <div class="sub">${catTitle} · ${Number(it.price).toLocaleString('fa-IR')} تومان</div>
      </div>
      <div class="item-actions">
        <button class="btn-danger btn-sm" data-del="${it.id}">حذف</button>
      </div>`;
    wrap.appendChild(row);
  });
  wrap.querySelectorAll('[data-del]').forEach(b => {
    b.addEventListener('click', async () => {
      try{
        const data = await apiCall('/api/menu/items/delete', { id: b.dataset.del });
        currentMenu = data.menu;
        renderItems();
      }catch(e){ alert(e.message); }
    });
  });
}

document.getElementById('addItemBtn').addEventListener('click', async () => {
  const name = document.getElementById('itName').value.trim();
  const category = document.getElementById('itCategory').value;
  const price = document.getElementById('itPrice').value.trim();
  const desc = document.getElementById('itDesc').value.trim();
  const tags = document.getElementById('itTags').value.split(',').map(t => t.trim()).filter(Boolean);

  if (!name || !category){ showMsg('itemMsg', 'نام آیتم و دسته الزامی‌ان.', 'err'); return; }

  try{
    const data = await apiCall('/api/menu/items', { name, category, price, desc, tags });
    currentMenu = data.menu;
    document.getElementById('itName').value = '';
    document.getElementById('itPrice').value = '';
    document.getElementById('itDesc').value = '';
    document.getElementById('itTags').value = '';
    showMsg('itemMsg', '✓ آیتم اضافه شد.', 'ok');
    renderItems();
  }catch(e){ showMsg('itemMsg', e.message, 'err'); }
});

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============ شروع ============ */
(async function init(){
  if (BytelabAuth.isLoggedIn()){
    await afterAuth();
  }
})();
</script>
</body>
</html>
